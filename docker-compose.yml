services:
  db:
    image: postgres:15
    container_name: bersihku_db             # <-- Ganti ini
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bersihku_db              # <-- Ganti ini (Nama database)
    ports:
      - "5432:5432"
    volumes:
      - bersihku_pgdata:/var/lib/postgresql/data  # <-- Ganti ini
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bersihku_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  bersihku_pgdata:                          # <-- Ganti ini (harus sama dengan line di atas)